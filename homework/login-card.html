<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign-up Card - Lab 1 Homework</title>
  <link rel="icon" href="https://www.uit.edu.vn/media/Logo_UIT_In_bde69cac47.jpg">
  <link rel="stylesheet" href="login-card.css">
</head>
<body>

  <main class="page-container">
    <div class="auth-card">
      <section class="auth-form-panel">
        <header class="form-header">
          <h1 class="form-title">Welcome back</h1>
          <p class="form-subtitle">Sign in to continue</p>
        </header>

        <form class="auth-form" action="#" method="POST" onsubmit="event.preventDefault();">
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="you@example.com" 
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="••••••••" 
              required
              autocomplete="current-password"
            >
          </div>

          <div class="form-options">
            <label for="remember" class="checkbox-container">
              <input type="checkbox" id="remember" name="remember">
              <span class="custom-checkbox"></span>
              <span class="checkbox-label">Remember me</span>
            </label>
          </div>

          <button type="submit" class="btn-submit">Sign In</button>
        </form>
      </section>

      <section class="auth-decor-panel">
        <div class="decor-content">
          <h2 class="decor-title">Hello, Friend!</h2>
          <p class="decor-description">
            Join our community and start building amazing web projects today.
          </p>
        </div>
      </section>
    </div>
  </main>

</body>
</html>
